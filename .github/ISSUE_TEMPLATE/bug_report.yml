name: Bug report
description: Report incorrect matching, a parser failure, or a crash. Redact real account data.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Please redact before pasting anything:** account numbers, UTRs, names,
        and amounts may be replaced with fake values as long as the *format*
        (column headers, delimiters, date shapes) is preserved. One redacted
        header line + one or two data rows is worth a hundred screenshots.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I ran `python tests/test_matching.py` and it passed (so the bug is in my input path, not a broken checkout)
          required: false
        - label: I redacted real account numbers/UTRs/amounts from everything below
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where did it go wrong?
      options:
        - Settlement parser (Razorpay CSV/recon)
        - Bank statement parser (CSV)
        - SBI PDF parser
        - OCR (scanned PDF)
        - Matching engine
        - Export (Tally / GST / TDS-1035)
        - CLI
        - Hosted service (settleflow.atlasnex.com)
        - Other / unsure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect vs. what actually happened? Include the exact CLI or Python call you made.
      placeholder: |
        Expected: settlement batch matched to the SBI credit by UTR.
        Actual: both rows land in `unmatched` even though the UTRs are identical.
    validations:
      required: true
  - type: textarea
    id: file-format
    attributes:
      label: Redacted file excerpt
      description: The header line and 1–3 sample rows of the offending file (redact values, keep formats).
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output / traceback
      render: shell
  - type: input
    id: version
    attributes:
      label: SettleFlow version and Python
      description: "`python -c \"import settleflow,sys; print(sys.version)\"` plus `git rev-parse --short HEAD` if from source"
      placeholder: "0.7.3 / Python 3.11.4"
    validations:
      required: true
  - type: dropdown
    id: willing-pr
    attributes:
      label: Would you open a PR?
      options:
        - "Yes"
        - "No — just reporting"
  - type: markdown
    attributes:
      value: |
        Security issues: **do not** file here — see `SECURITY.md`.
