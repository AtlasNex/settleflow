name: Security Scan

# Runs on pull_request AND on pushes to master. It used to be pull_request-only,
# which meant this project's actual deploy path — commit straight to master — was
# never scanned. The gate was watching the door nobody uses.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege: the scan needs to read the repo, nothing else. Without this the
# job inherits the repository default, which may be read-write for every scope.
permissions:
  contents: read

jobs:
  strix-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for diff-scope resolution

      - name: Install Strix (pinned to a release tag)
        # Pinned deliberately. This step runs with the LLM key below in scope, so
        # `curl <moving-url> | bash` would let an upstream change execute here without
        # a reviewable commit in this repo. The tag and the VERSION pin below both
        # point at v1.6.2 (the release published 2026-09-05), and the installer honours
        # VERSION for the binary it downloads. Bump both together.
        env:
          VERSION: "1.6.2"
        run: |
          curl -sSL https://raw.githubusercontent.com/usestrix/strix/v1.6.2/scripts/install.sh -o strix-install.sh
          bash strix-install.sh
          rm -f strix-install.sh

      - name: Run Security Scan
        # The model is CommandCode (an OpenAI-compatible gateway), not a direct
        # vendor key: the previous configuration pointed at a DeepSeek key with no
        # balance, so every run died at "LLM CONNECTION FAILED" and the job was red
        # for a billing reason rather than a security one.
        #
        # Model: zai-org/GLM-5.3 on CommandCode. Chosen on evidence, and it replaces
        # deepseek/deepseek-v4.1-flash, which was NOT reliable here: run 34600087325
        # died after 27 minutes with
        #   openai.BadRequestError 400 "The `reasoning_content` in the thinking mode
        #   must be passed back to the API."
        # after a first provider attempt returned 429 "Provider is at capacity". That is
        # a thinking-mode model paired with a client that does not round-trip
        # reasoning_content — a structural mismatch, not a transient blip, and it
        # arrives exactly when the gateway falls back to another upstream.
        #
        # GLM-5.3 is Strix's own documented default, and verified against this endpoint
        # before wiring: HTTP 200, finish_reason=tool_calls, correct tool arguments
        # (Strix is entirely tool-driven, so real tool_calls matter more than a chat
        # reply). Other verified-working substitutes on this plan:
        # moonshotai/Kimi-K3, Qwen/Qwen3.8-Max, xiaomi/mimo-v2.5-pro.
        # Plan-gated, do NOT use: claude-sonnet-5 and gpt-5.5 (403 MODEL_NOT_IN_PLAN).
        # The model id is not a secret, so it lives here.
        #
        # Exit codes: 0 = finished clean, 1 = fatal error, 2 = vulnerabilities found.
        id: scan
        env:
          STRIX_LLM: openai/zai-org/GLM-5.3
          LLM_API_BASE: https://api.commandcode.ai/provider/v1
          LLM_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
        run: |
          set +e
          strix -n -t ./ --scan-mode quick --max-budget 10 2>&1 | tee strix.log
          status=${PIPESTATUS[0]}
          set -e

          if grep -Eq "LLM CONNECTION FAILED|Insufficient Balance|MODEL_NOT_IN_PLAN|litellm.BadRequestError" strix.log; then
            echo "::error title=Strix scan did not run::The scan could not reach its model. This is NOT a passing security result — no scan happened. Check the COMMANDCODE_API_KEY secret and the plan's model access."
            exit 1
          fi

          case "$status" in
            0) echo "scan finished with no validated findings in the analysed scope" ;;
            1) echo "::error title=Strix scan failed::fatal error (missing env, Docker down, bad config)"; exit 1 ;;
            # 2 means the scan COMPLETED and validated vulnerabilities. This must fail
            # the build: a security gate that finds issues and reports success is worse
            # than no gate, because it manufactures false assurance. (This branch used
            # to only warn — the first real run found 12 issues including a HIGH and the
            # job went green.)
            2) echo "::error title=Strix found vulnerabilities::see the uploaded strix-runs artifact"; exit 2 ;;
            *) echo "::error title=Strix scan ended unexpectedly::exit $status"; exit "$status" ;;
          esac

      # Findings were invisible before: strix_runs/ died with the runner, so a red
      # job told you nothing. Always upload, so a failing gate is actionable.
      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-runs
          path: strix_runs/
          if-no-files-found: ignore
          retention-days: 30

      # Don't fail open: a run that hits the hard budget stop exits 0 but leaves
      # run.json status "stopped", not "completed". Enforce completion explicitly —
      # and only when a scan actually ran.
      - name: Fail unless the scan completed
        if: always() && hashFiles('strix_runs/*/run.json') != ''
        run: |
          run_json=$(ls -t strix_runs/*/run.json | head -1)
          status=$(jq -r .status "$run_json")
          if [ "$status" != "completed" ]; then
            echo "Strix run status is '$status' — the scan did not complete, so this run proves nothing either way. Check strix.log in the artifact for the cause (a model/API error is the usual one; a hard budget stop leaves status 'stopped')." >&2
            exit 1
          fi
