<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SettleFlow — runs</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #e5e5e5; padding: .5rem; text-align: left; }
    a { color: #2563eb; }
    .muted { color: #666; font-size: .85rem; }
  </style>
</head>
<body>
  <h1>Runs</h1>
  <p class="muted"><a href="/">← new reconcile</a></p>
  <table>
    <tr><th>ID</th><th>Created</th><th>Kind</th><th>Result</th><th>Exports</th></tr>
    {% for r in runs %}
    <tr>
      <td>{{ r['id'] }}</td>
      <td>{{ r['created_at'] }}</td>
      <td>{{ r['kind'] }}</td>
      <td>{{ r['result_json'] }}</td>
      <td>
        <a href="/runs/{{ r['id'] }}/export/tally.csv">tally</a>
        <a href="/runs/{{ r['id'] }}/export/gst.csv">gst</a>
        <a href="/runs/{{ r['id'] }}/export/tds1035.csv">tds1035</a>
        <a href="/runs/{{ r['id'] }}/exceptions">exceptions</a>
      </td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
