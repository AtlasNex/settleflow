<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 820px; margin: 0 auto; padding: 2rem 1rem 4rem;
    color: #1a1a1a; background: #fff; line-height: 1.55;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e8e8e8; background: #131313; }
    a { color: #7aa7ff; }
    .card, input, select, details, table { border-color: #333 !important; }
    .card { background: #1b1b1b; }
    code { background: #222; }
    .muted { color: #9a9a9a; }
    th { background: #1b1b1b; }
  }
  h1 { font-size: 1.8rem; margin: 0 0 .4rem; letter-spacing: -.02em; }
  h2 { font-size: 1.15rem; margin: 2rem 0 .6rem; }
  h3 { font-size: 1rem; margin: 1.4rem 0 .4rem; }
  a { color: #1b50d8; }
  .muted { color: #666; font-size: .875rem; }
  .lead { font-size: 1.02rem; margin: 0 0 1.5rem; max-width: 62ch; }
  form { margin: 0; }
  label { display: block; margin-top: 1rem; font-weight: 600; font-size: .9rem; }
  input[type=file], input[type=text], input[type=email], select {
    width: 100%; padding: .55rem; margin-top: .3rem; font: inherit;
    border: 1px solid #ccc; border-radius: 6px; background: transparent; color: inherit;
  }
  button, .btn {
    display: inline-block; margin-top: 1.4rem; padding: .65rem 1.3rem; font: inherit;
    font-weight: 600; cursor: pointer; border: 1px solid #1b50d8; border-radius: 6px;
    background: #1b50d8; color: #fff; text-decoration: none;
  }
  .btn.secondary { background: transparent; color: inherit; border-color: #999; font-weight: 500; }
  details { margin-top: 1.2rem; border: 1px solid #ddd; border-radius: 6px; padding: .6rem .8rem; }
  details summary { cursor: pointer; font-weight: 600; font-size: .9rem; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem 1.1rem; margin: 1rem 0; background: #fafafa; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .75rem; margin: 1rem 0; }
  .stat { border: 1px solid #ddd; border-radius: 8px; padding: .7rem .8rem; }
  .stat .n { font-size: 1.5rem; font-weight: 700; display: block; line-height: 1.2; }
  .stat .k { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: #666; }
  table { border-collapse: collapse; width: 100%; margin: .6rem 0; font-size: .9rem; }
  th, td { border-bottom: 1px solid #e5e5e5; padding: .5rem; text-align: left; vertical-align: top; }
  th { background: #f6f6f6; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
  code { background: #f2f2f2; padding: .1rem .3rem; border-radius: 4px; font-size: .9em; }
  .ok { color: #0a7d32; font-weight: 600; }
  .warn { color: #a35b00; font-weight: 600; }
  .danger { color: #b00020; font-weight: 600; }
  footer { margin-top: 3.5rem; padding-top: 1rem; border-top: 1px solid #e5e5e5; font-size: .85rem; color: #666; }
  footer a { margin-right: .9rem; }
  ul.plain { padding-left: 1.1rem; }
</style>
