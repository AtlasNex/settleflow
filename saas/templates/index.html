<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SettleFlow — UPI settlement reconciliation</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.6rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input[type=file], input[type=text], select { width: 100%; padding: .5rem; margin-top: .3rem; }
    button { margin-top: 1.5rem; padding: .7rem 1.4rem; font-size: 1rem; cursor: pointer; }
    .muted { color: #666; font-size: .85rem; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <h1>SettleFlow</h1>
  <p class="muted">Reconcile a payment-gateway settlement file against a bank statement, then export Tally / GST / TDS-1035 workpapers.</p>

  <form action="/reconcile" method="post" enctype="multipart/form-data">
    <label>Settlement file (Razorpay JSON)
      <input type="file" name="settlement_file" required>
    </label>
    <label>Settlement kind
      <select name="settlement_kind">
        <option value="razorpay_settlements">Razorpay — Fetch All Settlements (batch-level)</option>
        <option value="razorpay_recon">Razorpay — Settlement Recon (line-item level)</option>
      </select>
    </label>
    <label>Bank statement CSV
      <input type="file" name="bank_file" required>
    </label>
    <label>Bank CSV — UTR column <input type="text" name="bank_utr_col" value="utr"></label>
    <label>Bank CSV — amount column <input type="text" name="bank_amount_col" value="amount"></label>
    <label>Bank CSV — date column <input type="text" name="bank_date_col" value="date"></label>
    <button type="submit">Reconcile</button>
  </form>

  <p style="margin-top:2rem"><a href="/runs">View past runs →</a></p>
</body>
</html>
