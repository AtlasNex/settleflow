[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upirecon"
version = "0.1.0"
description = "Open-source UPI/NPCI settlement reconciliation library for India"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sanjay R.U. Kumar" }]
dependencies = []

[tool.setuptools.packages.find]
include = ["upirecon*"]
